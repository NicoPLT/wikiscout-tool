name: Aggiornamento e backup WikiScout

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wikiscout-nightly
  cancel-in-progress: false

jobs:
  update:
    # Disabled until the owner has added the secrets and explicitly enabled it.
    if: vars.WIKISCOUT_SYNC_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      ENABLE_SCHEDULER: 'false'
      REDIS_URL: ''
      SYNC_MAX_SECONDS: '2100'
      APIFY_TOKEN: ''
      ENABLE_API_FOOTBALL: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Verifica configurazione
        run: |
          test -n "$DATABASE_URL" || { echo 'Manca il segreto NEON_DATABASE_URL'; exit 1; }
          test -n "$BACKUP_ENCRYPTION_KEY" || { echo 'Manca il segreto BACKUP_ENCRYPTION_KEY'; exit 1; }
      - name: Installa dipendenze
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Backup cifrato prima dell'aggiornamento
        run: python scripts/backup.py --output ../backups/wikiscout.backup.enc
      - name: Conserva backup per 14 giorni
        uses: actions/upload-artifact@v4
        with:
          name: wikiscout-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: backups/*.enc
          retention-days: 14
          if-no-files-found: error
      - name: Aggiorna i giocatori (riprende dai checkpoint)
        run: python scripts/run_nightly.py

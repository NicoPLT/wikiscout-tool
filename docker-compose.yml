services:
  postgres:
    image: postgres:16-alpine
    container_name: wikiscout-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wikiscout
      POSTGRES_PASSWORD: wikiscout
      POSTGRES_DB: wikiscout
    ports:
      - "5432:5432"
    volumes:
      - wikiscout_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikiscout"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wikiscout-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wikiscout_postgres_data:

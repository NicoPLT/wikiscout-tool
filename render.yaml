# Solo servizio web gratuito. Il worker e i backup girano in .github/workflows/nightly.yml.
# Per un servizio Render creato manualmente, applicare le env dalla dashboard.
services:
  - type: web
    name: wikiscout-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # connection string "pooled" di Neon
      - key: SECRET_KEY
        sync: false
      - key: AUTH_EMAIL
        sync: false
      - key: AUTH_PASSWORD_HASH
        sync: false
      - key: CORS_ORIGINS
        sync: false # URL del frontend su Netlify
      - key: ENABLE_SCHEDULER
        value: "false" # aggiornamenti eseguiti da GitHub Actions
      - key: REDIS_URL
        value: ""
      - key: APIFY_TOKEN
        value: ""
      - key: ENABLE_API_FOOTBALL
        value: "false"
